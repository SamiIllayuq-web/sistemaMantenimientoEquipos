spring.application.name=mantenimiento

# Puerto 8081 (el 8080 ya lo usa otro proyecto)
server.port=8081

# --- Variables de entorno ---
# Las credenciales vienen de variables de entorno, nunca del codigo.
# Crear un archivo .env en la raiz del repo (esta en .gitignore) con:
#   DB_HOST=localhost
#   DB_PORT=5432
#   DB_NAME=mantenimiento
#   DB_USER=unh_mantenimiento
#   DB_PASSWORD=<tu password>
#   JWT_SECRET=<clave larga aleatoria>
#   EVIDENCIAS_DIR=/home/<usuario>/evidencias
#
# DB_URL sobrescribe la URL completa (para Supabase o cualquier otra BD):
#   DB_URL=jdbc:postgresql://aws-1-us-west-1.pooler.supabase.com:5432/postgres
# DB_SCHEMA fija el esquema de las tablas (por defecto 'public').
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mantenimiento}}
spring.datasource.username=${DB_USER:unh_mantenimiento}
spring.datasource.password=${DB_PASSWORD:unh_mantenimiento}

# --- Pool de conexiones ---
# El pooler de Supabase en modo SESION admite 15 conexiones por proyecto.
# Hikari abre 10 por defecto, lo que se come casi todo el cupo y deja al
# panel de Supabase (y al psql) sin conexion: "max clients reached".
# 5 conexiones alcanzan de sobra para esta app y dejan sitio al resto.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
# El pooler de Supabase cierra las conexiones ociosas por su cuenta. Hikari
# no se entera hasta que intenta usarlas y ve "This connection has been
# closed" (no es un fallo: descarta esa conexion y abre otra, pero ensucia
# el log). max-lifetime mas corto que el corte del pooler hace que las
# conexiones se renueven antes de que el pooler las mate.
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=120000

# --- Esquema ---
# En Supabase el schema 'public' YA tiene objetos (los de Supabase) y Flyway
# se niega a migrar un schema no vacio sin baseline. Por eso el sistema usa
# un schema PROPIO ('mantenimiento'): Flyway lo crea solo si no existe.
# En la BD local el default es 'public' (la base 'mantenimiento' nace vacia).
spring.flyway.schemas=${DB_SCHEMA:public}
spring.flyway.default-schema=${DB_SCHEMA:public}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}

# Carga automatica del .env de la raiz del repo (tiene formato properties).
# Asi `./mvnw spring-boot:run` funciona SIN hacer `source ../.env` a mano:
# el crash "Could not resolve placeholder 'JWT_SECRET'" era por esto.
# 'optional': si el .env no existe, la app arranca con los valores por defecto.
# Se buscan las DOS rutas para funcionar desde backend/ y desde la raiz:
#   ${user.dir}/../.env -> la raiz del repo (cuando el cwd es backend/)
#   ./.env             -> el cwd (cuando el cwd es la raiz del repo)
spring.config.import=optional:file:${user.dir}/../.env[.properties],optional:file:./.env[.properties]

# --- JPA ---
# ddl-auto=validate: NUNCA crea ni modifica tablas. Eso es trabajo de Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Jackson: fechas en ISO-8601 ---
# En Spring Boot 4 (Jackson 3) la propiedad cambio de sitio:
# spring.jackson.serialization.write-dates-as-timestamps
#   -> spring.jackson.datatype.datetime.write-dates-as-timestamps
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# --- multipart (evidencias) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Logs ---
logging.level.com.unh.mantenimiento=INFO
