# Perfil de pruebas: usa la base 'mantenimiento_test', NO la de desarrollo.
# La BD de pruebas se limpia y se reconstruye con Flyway en cada ejecucion.
# DB_TEST_HOST/DB_TEST_PORT son propios del perfil de pruebas: asi, cuando el
# .env de desarrollo apunte a Supabase, las pruebas siguen en el PostgreSQL
# local y NUNCA tocan la base de desarrollo.
spring.datasource.url=jdbc:postgresql://${DB_TEST_HOST:localhost}:${DB_TEST_PORT:5432}/${DB_TEST_NAME:mantenimiento_test}
spring.datasource.username=${DB_USER:unh_mantenimiento}
spring.datasource.password=${DB_PASSWORD:unh_mantenimiento}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=false

logging.level.com.unh.mantenimiento=INFO
logging.level.org.hibernate.SQL=WARN
